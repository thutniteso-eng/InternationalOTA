name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ota_dev
          POSTGRES_USER: ota_user
          POSTGRES_PASSWORD: ota_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ota_user -d ota_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ota_user:ota_password@localhost:55432/ota_dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check module boundaries
        run: pnpm lint:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Run tests
        run: pnpm test

      - name: Failure scenarios
        env:
          APP_ENV: test
          FAULT_INJECTION: '1'
        run: pnpm test:failure-scenarios

      - name: Build
        run: pnpm build

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      - name: Check dependency licenses
        run: pnpm licenses:check
