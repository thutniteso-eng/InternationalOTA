name: internationalota

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ota_dev}"
      POSTGRES_USER: "${POSTGRES_USER:-ota_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ota_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ota_user} -d ${POSTGRES_DB:-ota_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
